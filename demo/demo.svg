<text x="508.0" y="21" text-anchor="middle" font-size="12.5" fill="#7d879c">ace-agent — python ai_code.py --mock</text>
<text class="r0" x="22" y="52" xml:space="preserve"><tspan fill="#d7dce5">ACE</tspan><tspan fill="#7d879c"> v1.0 · AI Code Engine</tspan></text>
<text class="r1" x="22" y="76" xml:space="preserve"><tspan fill="#d7dce5">  模型: mock（离线演示）</tspan></text>
<text class="r2" x="22" y="100" xml:space="preserve"><tspan fill="#d7dce5">  权限: write | 目录: .</tspan></text>
<text class="r3" x="22" y="124" xml:space="preserve"><tspan fill="#f0c674">  ⚠ 当前为写权限：terminal_exec 可执行任意 shell 命令。生产环境建议 readonly 起步，按需用 /permission 切换。</tspan></text>
<text class="r4" x="22" y="148" xml:space="preserve"><tspan fill="#d7dce5">  输入 </tspan><tspan fill="#c39ac9">/help</tspan><tspan fill="#d7dce5"> 查看命令，</tspan><tspan fill="#c39ac9">@</tspan><tspan fill="#d7dce5"> 打开快捷方式，</tspan><tspan fill="#c39ac9">/exit</tspan><tspan fill="#d7dce5"> 退出</tspan></text>
<text class="r5" x="22" y="172" xml:space="preserve"><tspan fill="#d7dce5">❯ 现在几点</tspan><tspan class="cur" fill="#c39ac9">&#9601;</tspan></text>
<text class="r6" x="22" y="196" xml:space="preserve">&#160;</text>
<text class="r7" x="22" y="220" xml:space="preserve"><tspan fill="#d7dce5">◈ 思考中.</tspan></text>
<text class="r8" x="22" y="244" xml:space="preserve">&#160;</text>
<text class="r9" x="22" y="268" xml:space="preserve"><tspan fill="#d7dce5">◈ 正在调用工具</tspan></text>
<text class="r10" x="22" y="292" xml:space="preserve"><tspan fill="#d7dce5">  ↳ 工具 datetime_now </tspan><tspan fill="#5fd68a">✓</tspan><tspan fill="#d7dce5"> [SUCCESS]</tspan><tspan fill="#7d879c"> · 0.00s</tspan></text>
<text class="r11" x="22" y="316" xml:space="preserve">&#160;</text>
<text class="r12" x="22" y="340" xml:space="preserve"><tspan fill="#d7dce5">◈ 思考中.   当前时间是 2026-08-24 13:58:13</tspan></text>
<text class="r13" x="22" y="364" xml:space="preserve">&#160;</text>
<text class="r14" x="22" y="388" xml:space="preserve"><tspan fill="#5fd68a">  ✓ 完成（2 轮, 0.4s）</tspan></text>
<text class="r15" x="22" y="412" xml:space="preserve"><tspan fill="#d7dce5">❯ /status</tspan><tspan class="cur" fill="#c39ac9">&#9601;</tspan></text>
<text class="r16" x="22" y="436" xml:space="preserve"><tspan fill="#d7dce5">  会话: 2 轮 | 工具执行 1 次 | 违规 0 次 | 已运行 0s</tspan></text>
<text class="r17" x="22" y="460" xml:space="preserve"><tspan fill="#d7dce5">  语言: 中文 | 技能: 通用助手 | 引用: 0 项</tspan></text>
<text class="r18" x="22" y="484" xml:space="preserve"><tspan fill="#d7dce5">  权限: write | 违规累计 0 | 执行累计 1</tspan></text>
<text class="r19" x="22" y="508" xml:space="preserve"><tspan fill="#d7dce5">  快照: 0 个（自动清理上限 20，/undo 一键回滚最近）</tspan></text>
<text class="r20" x="22" y="532" xml:space="preserve"><tspan fill="#d7dce5">  模块: v2=True v1={'work': True, 'guardian': True, 'archive': True, 'nuwa': True} parser=True</tspan></text>
<text class="r21" x="22" y="556" xml:space="preserve"><tspan fill="#d7dce5">❯ /permission readonly</tspan><tspan class="cur" fill="#c39ac9">&#9601;</tspan></text>
<text class="r22" x="22" y="580" xml:space="preserve"><tspan fill="#5fd68a">权限已切换为 readonly</tspan></text>
<text class="r23" x="22" y="604" xml:space="preserve"><tspan fill="#d7dce5">❯ /exit</tspan><tspan class="cur" fill="#c39ac9">&#9601;</tspan></text>
<text class="r24" x="22" y="628" xml:space="preserve"><tspan fill="#7d879c">  再见，ACE 已退出。</tspan></text>
