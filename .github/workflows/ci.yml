name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # 允许手动触发

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 连续 push 时自动取消旧任务

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Compile check
        run: python -m compileall -q ai_code.py agent_runner.py execution_layer.py gateway_v2.py work.py guardian.py Archive.py Nuwa.py universal_document_parser.py

      - name: Run tests (端到端全量)
        run: python test_all.py

  lint:
    name: Ruff lint (安全子集)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # 只查语法错误/未定义名/被破坏的表达式等硬错误（E9/F63/F7/F82），
      # 不做风格强制，避免因换行宽度等导致 CI 红；ruff 尊重 .gitignore 自动跳过 .test_tmp
      - run: ruff check . --select E9,F63,F7,F82
