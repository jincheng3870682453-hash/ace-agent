name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # 允许手动触发

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 连续 push 时自动取消旧任务

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Compile check
        run: python -m compileall -q ai_code.py agent_runner.py execution_layer.py ace_http.py ace_net.py ace_context.py ace_executor.py ace_execpolicy.py ace_isolation.py ace_sessionlog.py ace_theme.py ace_selector.py ace_cards.py work.py guardian.py Archive.py Nuwa.py i18n.py universal_document_parser.py gateway_v2 tools e2e benchmarks

      - name: Run tests (端到端全量)
        run: python test_all.py

  go-test:
    name: Go executor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: executor/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # -race 需要 cgo；Windows 官方 runner 无 C 编译器，
      # 这里只在 ubuntu 上跑 race 检测（ADR-002 的约定）
      - name: Race test (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  lint:
    name: Ruff lint (安全子集)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # 硬错误集 + 死导入/未用变量/无比较比较。F401/F841 用 ruff --fix 自动清理，
      # 提交前本地保持零命中；ruff 尊重 .gitignore 自动跳过 .test_tmp
      - run: ruff check . --select E9,F63,F7,F82,F401,F841,E711,F811

  bench:
    name: Benchmark health (--quick)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bench (样本减半)
        run: |
          python benchmarks/bench_core.py --quick
          echo "--- bench_report.md 摘要 ---"
          cat benchmarks/results/bench_report.md

  e2e-real-model:
    # 真实模型端到端冒烟：未配 ACE_E2E_* secrets 时在 step 内自检跳过（不红）。
    # 注意：secrets 不能用于 job 级 if（GitHub 限制），故走 env 传空串 + shell 自检。
    name: E2E real model (OpenAI 兼容)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real-model E2E (提问 → 执行层裁决 → 工具 → 作答)
        env:
          ACE_E2E_BASE_URL: ${{ secrets.ACE_E2E_BASE_URL }}
          ACE_E2E_API_KEY: ${{ secrets.ACE_E2E_API_KEY }}
          ACE_E2E_MODEL: ${{ secrets.ACE_E2E_MODEL }}
        run: |
          if [ -z "${ACE_E2E_API_KEY}" ] || [ -z "${ACE_E2E_BASE_URL}" ] || [ -z "${ACE_E2E_MODEL}" ]; then
            echo "未配置 ACE_E2E_BASE_URL / ACE_E2E_API_KEY / ACE_E2E_MODEL → 跳过真实模型 e2e（配好 secrets 后自动启用）"
            exit 0
          fi
          python e2e/real_model_smoke.py
