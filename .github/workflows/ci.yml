name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # 允许手动触发

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 连续 push 时自动取消旧任务

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Compile check
        run: python -m compileall -q ai_code.py agent_runner.py execution_layer.py gateway_v2 tools i18n.py work.py guardian.py Archive.py Nuwa.py universal_document_parser.py

      - name: Run tests (端到端全量)
        run: python test_all.py

  go-test:
    name: Go executor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: executor/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # -race 需要 cgo；Windows 官方 runner 无 C 编译器，
      # 这里只在 ubuntu 上跑 race 检测（ADR-002 的约定）
      - name: Race test (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  lint:
    name: Ruff lint (安全子集)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # 只查语法错误/未定义名/被破坏的表达式等硬错误（E9/F63/F7/F82），
      # 不做风格强制，避免因换行宽度等导致 CI 红；ruff 尊重 .gitignore 自动跳过 .test_tmp
      - run: ruff check . --select E9,F63,F7,F82

  bench:
    name: Benchmark health (--quick)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bench (样本减半)
        run: |
          python benchmarks/bench_core.py --quick
          echo "--- bench_report.md 摘要 ---"
          cat benchmarks/results/bench_report.md

  e2e-real-model:
    # 真实模型端到端冒烟：只有仓库配了 ACE_E2E_* secrets 才跑，否则整任务跳过（不红）
    name: E2E real model (OpenAI 兼容)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ secrets.ACE_E2E_API_KEY != '' && secrets.ACE_E2E_BASE_URL != '' && secrets.ACE_E2E_MODEL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real-model E2E (提问 → 执行层裁决 → 工具 → 作答)
        env:
          ACE_E2E_BASE_URL: ${{ secrets.ACE_E2E_BASE_URL }}
          ACE_E2E_API_KEY: ${{ secrets.ACE_E2E_API_KEY }}
          ACE_E2E_MODEL: ${{ secrets.ACE_E2E_MODEL }}
        run: python e2e/real_model_smoke.py
